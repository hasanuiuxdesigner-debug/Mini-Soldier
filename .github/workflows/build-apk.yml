name: Build Android APK

# Runs whenever the game file or the Android project changes, and can also be started by hand
# from the Actions tab (Run workflow).
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Put the game inside the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build the APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Scrap-Platoon.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: Scrap-Platoon-APK
          path: Scrap-Platoon.apk

      - name: Publish the APK under Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Scrap-Platoon.apk --title "Scrap Platoon APK (build ${{ github.run_number }})" --notes "Download Scrap-Platoon.apk on your Android phone and open it to install."
