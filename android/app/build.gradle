plugins {
    id 'com.android.application'
}

android {
    namespace 'com.scrapplatoon.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.scrapplatoon.game'
        minSdk 24
        targetSdk 34
        // every build on GitHub gets a higher number, so a new APK installs over the old one
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName '1.5'
    }

    signingConfigs {
        release {
            storeFile file('../keystore.jks')
            storePassword 'scrapplatoon'
            keyAlias 'scrapplatoon'
            keyPassword 'scrapplatoon'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
